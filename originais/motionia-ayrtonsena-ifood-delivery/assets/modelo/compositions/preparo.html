      tl.to("#pr-app", { x: 0, duration: 0.4, ease: "expo.out" }, 2.53);

      gsap.utils.toArray("#pr-info > *").forEach(function (el, i) {
        tl.fromTo(el, { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 2.66 + i * 0.05);
