<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #f8f1e7;
      font-family: "Montserrat", sans-serif;
    }
    #do-texto {
      position: absolute;
      inset: 0;
    }
    #do-l1 {
      position: absolute;
      left: 0;
      right: 0;
      top: 40px;
      text-align: center;
      font-size: 210px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ea1d2c;
    }
    #do-l1 span {
      display: inline-block;
      margin: 0 0.1em;
    }
    #do-l2 {
      position: absolute;
      inset: 0;
    }
    .do-letra {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 250px;
      font-weight: 900;
      line-height: 1;
      color: #ea1d2c;
      transform-origin: 50% 85%;
    }
    #do-sacola {
      position: absolute;
      left: 735px;
      top: 500px;
      width: 450px;
      height: 540px;
      transform-origin: 50% 100%;
    }
    #do-linhas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }
    #do-linhas path {
      fill: none;
      stroke: #f5b21b;
      stroke-width: 24;
      stroke-linecap: round;
    }
  </style>
  <div id="root" data-composition-id="doido" data-width="1920" data-height="1080">
    <div id="do-texto">
      <div id="do-l1"><span id="do-tu">TU</span><span id="do-e">É</span></div>
      <!-- "DOOOOIDO": letras posicionadas no build medindo a fonte -->
      <div id="do-l2" data-texto="DOOOOIDO"></div>
    </div>
    <svg id="do-linhas" viewBox="0 0 1920 1080">
      <path d="M 700 560 L 640 520" /><path d="M 690 660 L 620 660" /><path d="M 1220 560 L 1280 520" /><path d="M 1230 660 L 1300 660" />
    </svg>
    <img id="do-sacola" src="assets/img/sacola-ifood.png" alt="sacola iFood" />
  </div>
  <script>
    (function () {
      var BASE = 470, FS = 250, TRACK = -0.03;
      function construir() {
        var el = document.getElementById("do-l2");
        var texto = el.getAttribute("data-texto");
        var c = document.createElement("canvas").getContext("2d");
        c.font = "900 " + FS + "px Montserrat";
        var xs = [], w = c.measureText(texto).width + (texto.length - 1) * TRACK * FS;
        for (var i = 0; i < texto.length; i++) xs.push(960 - w / 2 + c.measureText(texto.slice(0, i)).width + i * TRACK * FS);
        var L = [];
        for (var j = 0; j < texto.length; j++) {
          var s = document.createElement("span"); s.className = "do-letra"; s.textContent = texto[j];
          s.style.left = xs[j] + "px"; s.style.top = (BASE - 0.8 * FS) + "px";
          el.appendChild(s); L.push(s);
        }
        var wO = xs[2] - xs[1]; // largura de um "O"
        var extras = [L[2], L[3], L[4]], cauda = [L[5], L[6], L[7]];
        var tl = gsap.timeline({ paused: true });
        // 0 = 39,5 abs · Tu 0,05 · é 0,25 · doido 0,45 · vá-se embora 2,32
        tl.fromTo("#do-tu", { scale: 0, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.4)" }, 0.05);
        tl.fromTo("#do-e", { scale: 0, rotation: 10 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.4)" }, 0.25);
        // "DOIDO" bate primeiro, com os O's extras escondidos dentro do primeiro O
        [L[0], L[1]].concat(cauda).forEach(function (l, i) {
          tl.fromTo(l, { y: -500, scaleY: 1.3 }, { y: 0, scaleY: 1.3, duration: 0.16, ease: "power3.in" }, 0.42 + i * 0.03);
          tl.to(l, { scaleY: 0.78, scaleX: 1.15, duration: 0.05 }, 0.58 + i * 0.03);
          tl.to(l, { scaleY: 1, scaleX: 1, duration: 0.4, ease: "elastic.out(1, 0.35)" }, 0.63 + i * 0.03);
        });
        extras.forEach(function (l, k) {
          tl.fromTo(l, { x: -(k + 1) * wO, scaleX: 0, opacity: 0 }, { x: -(k + 1) * wO, scaleX: 0, opacity: 0, duration: 0.01 }, 0);
        });
        cauda.forEach(function (l) { tl.fromTo(l, { x: -3 * wO }, { x: -3 * wO, duration: 0.01 }, 0); });
        // os O's vão se multiplicando: DOIDO → DOOOOIDO
        [0.72, 0.9, 1.08].forEach(function (t, k) {
          tl.to(extras[k], { x: 0, scaleX: 1, opacity: 1, duration: 0.25, ease: "back.out(1.8)" }, t);
          tl.to(cauda, { x: -(2 - k) * wO, duration: 0.25, ease: "back.out(1.8)" }, t);
        });
        // risada: tudo chacoalha
        for (var k2 = 0; k2 < 8; k2++) {
          tl.to("#do-texto", { rotation: k2 % 2 ? -2 : 2, y: k2 % 2 ? 0 : -10, duration: 0.09, ease: "sine.inOut" }, 1.5 + k2 * 0.09);
        }
        tl.to("#do-texto", { rotation: 0, y: 0, duration: 0.15 }, 2.22);
        // a sacola chega no "vá-se embora" (41,8 → pousa 42,15)
        tl.fromTo("#do-sacola", { y: 900, rotation: 14 }, { y: -40, rotation: -4, duration: 0.3, ease: "power3.out" }, 2.3);
        tl.to("#do-sacola", { y: 0, rotation: 0, duration: 0.12, ease: "power2.in" }, 2.6);
        tl.to("#do-sacola", { scaleY: 0.86, scaleX: 1.1, duration: 0.06, ease: "power2.out" }, 2.72);
        tl.to("#do-sacola", { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.35)" }, 2.78);
        tl.fromTo("#do-linhas path", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.16, ease: "back.out(3)", stagger: 0.03 }, 2.72);
        tl.to("#do-linhas path", { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in" }, 3.05);
        // "vá-se embora": o texto ri de novo
        for (var k3 = 0; k3 < 6; k3++) {
          tl.to("#do-texto", { rotation: k3 % 2 ? -1.5 : 1.5, duration: 0.1, ease: "sine.inOut" }, 3.0 + k3 * 0.1);
        }
        tl.to("#do-texto", { rotation: 0, duration: 0.15 }, 3.6);
        window.__timelines["doido"] = tl;
      }
      document.fonts.load("900 250px Montserrat").then(construir);
    })();
  </script>
</template>
