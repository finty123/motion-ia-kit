<template>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: "Montserrat", sans-serif;
    }
    #pa-vermelho {
      position: absolute;
      inset: 0;
      background: #ea1d2c;
    }
    /* "restaurante aberto agora" */
    #pa-aberto {
      position: absolute;
      inset: 0;
    }
    #pa-rest {
      position: absolute;
      left: 0;
      right: 0;
      top: 250px;
      text-align: center;
      font-size: 250px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #ea1d2c;
      white-space: nowrap;
    }
    #pa-rest span {
      display: inline-block;
    }
    #pa-pilula {
      position: absolute;
      left: 50%;
      top: 560px;
      width: 1240px;
      margin-left: -620px;
      height: 230px;
      border-radius: 115px;
      background: #2eb35a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      color: #ffffff;
      font-size: 150px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    #pa-pilula i {
      display: block;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: #ffffff;
    }
    /* "na palma da sua mão" */
    #pa-palma {
      position: absolute;
      inset: 0;
    }
    .pa-frase {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 200px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff;
      white-space: nowrap;
    }
    .pa-frase span {
      display: inline-block;
      margin: 0 0.12em;
    }
    #pa-f1 {
      top: 60px;
    }
    #pa-f2 {
      top: 830px;
    }
    .pa-anel {
      position: absolute;
      left: 960px;
      top: 540px;
      width: 900px;
      height: 900px;
      margin: -450px 0 0 -450px;
      border-radius: 50%;
      border: 10px solid rgba(255, 255, 255, 0.35);
    }
    .pa-selo {
      position: absolute;
      width: 230px;
      height: 230px;
    }
    #pa-selo1 {
      left: 150px;
      top: 330px;
    }
    #pa-selo2 {
      left: 1540px;
      top: 520px;
    }
    #pa-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="palma" data-width="1920" data-height="1080">
    <div id="pa-aberto">
      <div id="pa-rest"><span>r</span><span>e</span><span>s</span><span>t</span><span>a</span><span>u</span><span>r</span><span>a</span><span>n</span><span>t</span><span>e</span></div>
      <div id="pa-pilula"><i></i><span>aberto agora</span></div>
    </div>
    <div id="pa-vermelho"></div>
    <div id="pa-palma">
      <div id="pa-anel1" class="pa-anel"></div>
      <div id="pa-anel2" class="pa-anel"></div>
      <div id="pa-anel3" class="pa-anel"></div>
      <div id="pa-f1" class="pa-frase"><span id="pa-w1">NA</span><span id="pa-w2">PALMA</span></div>
      <div id="pa-f2" class="pa-frase"><span id="pa-w3">DA</span><span id="pa-w4">SUA</span><span id="pa-w5">MÃO!</span></div>
      <!-- selos "flor" com carrinho e % (como na referência) -->
      <svg id="pa-selo1" class="pa-selo" viewBox="-115 -115 230 230">
        <path d="M0 -110 Q 20 -105 30 -92 Q 50 -100 64 -89 Q 70 -70 85 -64 Q 100 -50 92 -30 Q 105 -20 110 0 Q 105 20 92 30 Q 100 50 85 64 Q 70 70 64 89 Q 50 100 30 92 Q 20 105 0 110 Q -20 105 -30 92 Q -50 100 -64 89 Q -70 70 -85 64 Q -100 50 -92 30 Q -105 20 -110 0 Q -105 -20 -92 -30 Q -100 -50 -85 -64 Q -70 -70 -64 -89 Q -50 -100 -30 -92 Q -20 -105 0 -110 Z" fill="#ffffff" />
        <g fill="none" stroke="#ea1d2c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -52 -38 L -34 -38 L -18 26 L 40 26 L 52 -18 L -26 -18" />
        </g>
        <circle cx="-10" cy="46" r="10" fill="#ea1d2c" />
        <circle cx="34" cy="46" r="10" fill="#ea1d2c" />
      </svg>
      <svg id="pa-selo2" class="pa-selo" viewBox="-115 -115 230 230">
        <path d="M0 -110 Q 20 -105 30 -92 Q 50 -100 64 -89 Q 70 -70 85 -64 Q 100 -50 92 -30 Q 105 -20 110 0 Q 105 20 92 30 Q 100 50 85 64 Q 70 70 64 89 Q 50 100 30 92 Q 20 105 0 110 Q -20 105 -30 92 Q -50 100 -64 89 Q -70 70 -85 64 Q -100 50 -92 30 Q -105 20 -110 0 Q -105 -20 -92 -30 Q -100 -50 -85 -64 Q -70 -70 -64 -89 Q -50 -100 -30 -92 Q -20 -105 0 -110 Z" fill="#ffffff" />
        <path d="M -40 44 L 40 -44" stroke="#ea1d2c" stroke-width="14" stroke-linecap="round" />
        <circle cx="-30" cy="-30" r="16" fill="none" stroke="#ea1d2c" stroke-width="12" />
        <circle cx="30" cy="30" r="16" fill="none" stroke="#ea1d2c" stroke-width="12" />
      </svg>
    </div>
    <canvas id="pa-canvas" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      var W = 1920, H = 1080, PI = Math.PI;
      var DUR = 3.3; // 16,10 → 19,40 abs

      var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("pa-canvas"), antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.outputEncoding = THREE.sRGBEncoding;
      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 100);

      var eC = document.createElement("canvas"); eC.width = 1024; eC.height = 512;
      var ec = eC.getContext("2d");
      var eg = ec.createLinearGradient(0, 0, 1024, 512);
      eg.addColorStop(0, "#2a0a0e"); eg.addColorStop(0.22, "#7a1420"); eg.addColorStop(0.32, "#ffffff");
      eg.addColorStop(0.42, "#3a0c12"); eg.addColorStop(0.62, "#ffe2d6"); eg.addColorStop(0.72, "#5a0f18"); eg.addColorStop(1, "#2a0a0e");
      ec.fillStyle = eg; ec.fillRect(0, 0, 1024, 512);
      var eT = new THREE.CanvasTexture(eC); eT.mapping = THREE.EquirectangularReflectionMapping;
      var pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromEquirectangular(eT).texture;
      eT.dispose(); pm.dispose();
      scene.add(new THREE.AmbientLight(0x553338, 0.7));
      var key = new THREE.DirectionalLight(0xfff1e6, 2.2); key.position.set(-3, 4, 5); scene.add(key);
      var fill = new THREE.PointLight(0xffd0c0, 1.2, 12); fill.position.set(3, -1, 4); scene.add(fill);

      // ── tela: a lista do app desenhada em canvas ──
      var SW = 600, SH = 1300;
      var tela = document.createElement("canvas"); tela.width = SW; tela.height = SH;
      var tc = tela.getContext("2d");
      var telaTex = new THREE.CanvasTexture(tela);
      telaTex.encoding = THREE.sRGBEncoding; telaTex.minFilter = THREE.LinearFilter; telaTex.generateMipmaps = false;
      var fotos = {};
      var LOJAS = [
        ["Pizzaria Lua Cheia", "#8C1A2E", "pizza"], ["Burger da Madruga", "#F5B21B", "burger"], ["Açaí do Corujão", "#5B2A86", "acai"],
        ["Pastel da Insônia", "#E8622A", "pastel"], ["Sushi 24h", "#1B1B1F", "S24"], ["Esfiha Noturna", "#2E7D5B", "EN"],
        ["Dogão do Beco", "#C8101F", "DB"], ["Tapioca da Lua", "#1F3A93", "TL"]
      ];
      function rr(x, y, w, h, r) { tc.beginPath(); tc.moveTo(x + r, y); tc.arcTo(x + w, y, x + w, y + h, r); tc.arcTo(x + w, y + h, x, y + h, r); tc.arcTo(x, y + h, x, y, r); tc.arcTo(x, y, x + w, y, r); tc.closePath(); }
      function desenharTela(rolagem) {
        tc.fillStyle = "#ffffff"; tc.fillRect(0, 0, SW, SH);
        tc.save(); tc.translate(0, -rolagem);
        tc.fillStyle = "#3e3e3e"; tc.font = "700 26px Montserrat"; tc.fillText("Rua da Madrugada, 247", 36, 120);
        tc.fillStyle = "#EA1D2C"; tc.font = "800 36px Montserrat"; tc.fillText("Restaurantes", 36, 190);
        tc.fillRect(36, 204, 236, 5);
        tc.fillStyle = "#a6a6a6"; tc.font = "600 36px Montserrat"; tc.fillText("Mercados", 310, 190);
        for (var i = 0; i < LOJAS.length; i++) {
          var y = 250 + i * 150, L = LOJAS[i];
          tc.save(); rr(36, y, 110, 110, 24); tc.fillStyle = L[1]; tc.fill(); tc.clip();
          if (fotos[L[2]]) { var im = fotos[L[2]]; var w = 150, h = w * im.height / im.width; tc.drawImage(im, 36 - 10, y + 110 - h + 14, w, h); }
          else { tc.fillStyle = "#fff"; tc.font = "900 40px Montserrat"; tc.textAlign = "center"; tc.fillText(L[2], 91, y + 70); tc.textAlign = "left"; }
          tc.restore();
          tc.fillStyle = "#3e3e3e"; tc.font = "700 30px Montserrat"; tc.fillText(L[0], 168, y + 34);
          tc.fillStyle = "#9a9a9a"; tc.font = "500 22px Montserrat"; tc.fillText("★ 4,8 · 25–35 min", 168, y + 66);
          rr(168, y + 80, 168, 32, 16); tc.fillStyle = "#e6f6ec"; tc.fill();
          tc.fillStyle = "#2eb35a"; tc.font = "700 20px Montserrat"; tc.fillText("● aberto agora", 180, y + 103);
        }
        tc.restore();
        tc.fillStyle = "#000"; rr(SW / 2 - 70, 26, 140, 40, 20); tc.fill();
        telaTex.needsUpdate = true;
      }
      function planarUv(mesh) {
        var g = mesh.geometry; g.computeBoundingBox();
        var bb = g.boundingBox, pos = g.attributes.position;
        var w = bb.max.x - bb.min.x || 1, h = bb.max.y - bb.min.y || 1;
        var uv = new Float32Array(pos.count * 2);
        for (var i = 0; i < pos.count; i++) { uv[i * 2] = (pos.getX(i) - bb.min.x) / w; uv[i * 2 + 1] = (pos.getY(i) - bb.min.y) / h; }
        g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      }

      var grupo = new THREE.Group(); scene.add(grupo);
      var S = { y: -9, giro: -PI, rx: -0.15, rz: -0.42, camZ: 11.5, rolagem: 0 };
      function render() {
        var t = tl.time();
        desenharTela(S.rolagem);
        // girando em 3D: balanço em Y e X que cresce depois de subir e some no mergulho
        var f = Math.max(0, t - 1.45);
        var a = Math.min(1, f / 0.35) * (1 - Math.min(1, Math.max(0, (t - 2.7) / 0.3)));
        grupo.position.set(0, S.y + Math.sin(f * 2.4) * 0.05 * a, 0);
        grupo.rotation.set(S.rx + Math.sin(f * 2.2) * 0.2 * a, PI + S.giro + Math.sin(f * 2.9) * 0.62 * a, S.rz + Math.sin(f * 1.7) * 0.06 * a);
        camera.position.set(0, 0, S.camZ);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }

      var tl = gsap.timeline({ paused: true });
      tl.to(S, { duration: DUR }, 0);
      tl.eventCallback("onUpdate", render);

      // ── 0–1,15 (16,10–17,25): "restaurante" sobe, pílula verde "aberto agora" estala ──
      tl.fromTo("#pa-vermelho", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(0% at 50% 50%)", duration: 0.01 }, 0);
      tl.fromTo("#pa-palma", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      gsap.utils.toArray("#pa-rest span").forEach(function (s, i) {
        tl.fromTo(s, { y: 340, scaleY: 1.6, opacity: 0 }, { y: 0, scaleY: 1, opacity: 1, duration: 0.42, ease: "back.out(1.6)" }, 0.02 + i * 0.025);
      });
      tl.fromTo("#pa-pilula", { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, 0.58);
      tl.fromTo("#pa-pilula span", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.66);
      tl.fromTo("#pa-pilula i", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.62);
      tl.fromTo("#pa-aberto", { scale: 1 }, { scale: 1.04, duration: 0.53, ease: "sine.inOut" }, 0.6);
      // ── 1,15 (17,25): o vermelho abre do centro, o texto sai voando ──
      tl.to("#pa-aberto", { y: -260, scale: 0.9, opacity: 0, duration: 0.3, ease: "power3.in" }, 1.15);
      tl.to("#pa-vermelho", { clipPath: "circle(120% at 50% 50%)", duration: 0.4, ease: "power2.inOut" }, 1.15);
      tl.set("#pa-palma", { opacity: 1 }, 1.3);
      // celular sobe girando meia volta, já mostrando a lista (17,30–17,95)
      tl.to(S, { y: 0, duration: 0.56, ease: "back.out(1.2)" }, 1.13);
      tl.to(S, { giro: 0.25, duration: 0.6, ease: "power2.out" }, 1.13);
      tl.to(S, { rolagem: 320, duration: 1.4, ease: "sine.inOut" }, 1.6);
      // palavras batem uma a uma (17,45 → 17,93)
      ["#pa-w1", "#pa-w2", "#pa-w3", "#pa-w4", "#pa-w5"].forEach(function (id, i) {
        tl.fromTo(id, { scale: 1.6, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.24, ease: "back.out(2)" }, 1.16 + i * 0.135);
      });
      // anéis pulsando do centro do celular
      ["#pa-anel1", "#pa-anel2", "#pa-anel3"].forEach(function (id, i) {
        tl.fromTo(id, { scale: 0.35, opacity: 0 }, { scale: 0.35, opacity: 0, duration: 0.01 }, 0);
        for (var k = 0; k < 3; k++) {
          var t0 = 1.45 + i * 0.2 + k * 0.6;
          if (t0 > 2.9) break;
          tl.fromTo(id, { scale: 0.35, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.6, ease: "power1.out", immediateRender: false }, t0);
        }
      });
      // selos estalam nos cantos
      tl.fromTo("#pa-selo1", { scale: 0, rotation: -40 }, { scale: 1, rotation: -8, duration: 0.35, ease: "back.out(2.6)" }, 1.69);
      tl.fromTo("#pa-selo2", { scale: 0, rotation: 40 }, { scale: 1, rotation: 10, duration: 0.35, ease: "back.out(2.6)" }, 1.83);
      tl.to("#pa-selo1", { y: -16, rotation: -2, duration: 0.7, ease: "sine.inOut" }, 2.05);
      tl.to("#pa-selo2", { y: 14, rotation: 4, duration: 0.6, ease: "sine.inOut" }, 2.19);
      // ── 2,75 (18,85): mergulho na tela → home do app ──
      tl.to(S, { giro: 0, rx: 0, rz: 0, duration: 0.35, ease: "power2.inOut" }, 2.75);
      tl.to(S, { camZ: 1.3, duration: 0.5, ease: "power3.in" }, 2.75);
      tl.to("#pa-palma", { scale: 1.6, opacity: 0, duration: 0.4, ease: "power3.in" }, 2.8);

      var faltam = 6;
      document.fonts.load("700 30px Montserrat").then(function () { um(); });
      function um() { if (--faltam === 0) { render(); window.__timelines["palma"] = tl; } }
      ["pizza", "burger", "acai", "pastel"].forEach(function (n) {
        var im = new Image(); im.onload = function () { fotos[n] = im; um(); }; im.src = "assets/img/comidas/" + n + ".png";
      });
      new THREE.GLTFLoader().load("assets/models/iphone.glb", function (gltf) {
        var m = gltf.scene;
        var box = new THREE.Box3().setFromObject(m);
        m.scale.setScalar(3.2 / box.getSize(new THREE.Vector3()).y);
        box.setFromObject(m);
        m.position.sub(box.getCenter(new THREE.Vector3()));
        m.traverse(function (ch) {
          if (!ch.isMesh) return;
          if (ch.name.indexOf("front-glass") === 0) { planarUv(ch); ch.material = new THREE.MeshBasicMaterial({ map: telaTex, toneMapped: false }); }
          if (ch.name.indexOf("apple-logo") === 0) ch.visible = false;
          var mn = (ch.material && ch.material.name) || "";
          if (mn.indexOf("aluminium") >= 0 || mn.indexOf("antenna") >= 0 || mn.indexOf("lens-bezel") >= 0 || mn.indexOf("lens-ring") >= 0) { ch.material = ch.material.clone(); ch.material.color = new THREE.Color(0x2a2a30); ch.material.metalness = 0.85; ch.material.roughness = 0.32; }
          if (mn.indexOf("ceramic-shield-back") >= 0) { ch.material = ch.material.clone(); ch.material.color = new THREE.Color(0x1c1c21); }
        });
        m.updateWorldMatrix(true, true);
        var fr = m.getObjectByName("front-glass"), bk = m.getObjectByName("rear-window");
        if (fr && bk) { var a = new THREE.Vector3(), b = new THREE.Vector3(); fr.getWorldPosition(a); bk.getWorldPosition(b); if (a.z > b.z) m.rotation.y += PI; }
        grupo.add(m);
        um();
      });
    })();
  </script>
</template>
