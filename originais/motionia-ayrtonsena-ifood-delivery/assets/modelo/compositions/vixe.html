<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #f8f1e7;
      font-family: "Montserrat", sans-serif;
    }
    #vx-persp {
      position: absolute;
      inset: 0;
      perspective: 1400px;
    }
    #vx-mundo {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-style: preserve-3d;
    }
    .vx-p {
      position: absolute;
      left: 0;
      top: 0;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      white-space: nowrap;
      transform-origin: 50% 60%;
    }
    #vx-vermelho {
      position: absolute;
      inset: 0;
      background: #ea1d2c;
    }
    #vx-relogio {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #vx-dig {
      display: flex;
      font-weight: 900;
      font-size: 520px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #f8f1e7;
      font-variant-numeric: tabular-nums;
    }
    #vx-dig span {
      display: inline-block;
      transform-origin: 50% 92%;
    }
    .vx-linhas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }
    .vx-linhas path {
      fill: none;
      stroke: #f5b21b;
      stroke-width: 26;
      stroke-linecap: round;
    }
  </style>
  <div id="root" data-composition-id="vixe" data-width="1920" data-height="1080">
    <!-- "Vixe Maria, rapaz, que fome, viu?" — o texto acompanha a fala, a câmera voa entre as palavras -->
    <div id="vx-persp">
      <div id="vx-mundo">
        <div id="vx-w1" class="vx-p" data-layout-allow-overlap style="font-size: 330px; color: #ea1d2c">Vixe</div>
        <div id="vx-w2" class="vx-p" data-layout-allow-overlap style="font-size: 230px; color: #8c1a2e">Maria,</div>
        <div id="vx-w3" class="vx-p" data-layout-allow-overlap style="font-size: 190px; color: #ea1d2c">rapaz,</div>
        <div id="vx-w4" class="vx-p" data-layout-allow-overlap style="font-size: 280px; color: #8c1a2e">que fome,</div>
        <div id="vx-w5" class="vx-p" data-layout-allow-overlap style="font-size: 380px; color: #ea1d2c">viu?</div>
      </div>
    </div>
    <!-- "2:47" estala no vermelho com o ronco -->
    <div id="vx-vermelho"></div>
    <div id="vx-relogio">
      <div id="vx-dig"><span id="vx-d1">2</span><span id="vx-d2">:</span><span id="vx-d3">4</span><span id="vx-d4">7</span></div>
    </div>
    <svg class="vx-linhas" viewBox="0 0 1920 1080">
      <path id="vx-l1" d="M 300 330 L 220 270" /><path id="vx-l2" d="M 270 540 L 160 540" /><path id="vx-l3" d="M 300 750 L 220 810" />
      <path id="vx-l4" d="M 1620 330 L 1700 270" /><path id="vx-l5" d="M 1650 540 L 1760 540" /><path id="vx-l6" d="M 1620 750 L 1700 810" />
    </svg>
  </div>
  <script>
    (function () {
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var Q = 1 / 30;
      // palavras no espaço 3D: [id, x, y, z, rotY, rotZ, quando entra (fala)]
      var P = [
        ["#vx-w1", 560, 300, 0, -14, -5, 0.12],
        ["#vx-w2", 1080, 610, -380, 18, 4, 0.66],
        ["#vx-w3", 520, 820, -760, -16, -3, 1.01],
        ["#vx-w4", 820, 230, -1140, 12, 3, 1.52],
        ["#vx-w5", 820, 560, -1560, 0, -4, 2.3]
      ];
      function construir() {
        var tl = gsap.timeline({ paused: true });
        var c = document.createElement("canvas").getContext("2d");
        // centro de cada palavra (pra câmera mirar nela)
        var centros = P.map(function (p) {
          var el = document.querySelector(p[0]);
          c.font = "900 " + parseFloat(el.style.fontSize) + "px Montserrat";
          var w = c.measureText(el.textContent).width * 0.96, h = parseFloat(el.style.fontSize);
          gsap.set(el, { x: p[1] - w / 2, y: p[2] - h / 2, z: p[3], rotationY: p[4], rotation: p[5] });
          return { x: p[1], y: p[2], z: p[3] };
        });
        tl.fromTo("#vx-vermelho", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(0% at 50% 50%)", duration: 0.01 }, 0);
        tl.fromTo("#vx-relogio", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        gsap.set(".vx-linhas path", { scale: 0 });
        // câmera: o mundo anda até cada palavra (com um giro leve), sempre viva
        function camera(i) { var k = centros[i]; return { x: 960 - k.x, y: 540 - k.y, z: -k.z + 0, rotationY: -P[i][4] * 0.6, rotationX: (i % 2 ? 6 : -6) }; }
        tl.fromTo("#vx-mundo", Object.assign({}, camera(0), { z: -500, rotationY: -20 }), Object.assign({}, camera(0), { duration: 0.42, ease: "expo.out" }), 0);
        for (var i = 1; i < P.length; i++) {
          tl.to("#vx-mundo", Object.assign({}, camera(i), { duration: 0.42, ease: "power3.inOut" }), P[i][6] - 0.2);
        }
        // deriva final pra frente até o 2:47
        tl.to("#vx-mundo", { z: "+=260", rotationZ: 3, duration: 0.9, ease: "power1.in" }, 2.45);
        // cada palavra estala quando é dita
        P.forEach(function (p, i) {
          tl.fromTo(p[0], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)" }, p[6] - 0.02);
          // quando a câmera segue pra próxima, a palavra some antes de passar colada na lente
          if (i < P.length - 1) tl.to(p[0], { opacity: 0, duration: 0.22, ease: "power2.in" }, P[i + 1][6] - 0.08);
        });
        // "fome" faz a barriga roncar: as palavras tremem
        var r = mulberry32(3);
        for (var k = 0; k < 12; k++) tl.to("#vx-persp", { x: (r() * 2 - 1) * 10, y: (r() * 2 - 1) * 8, duration: Q, ease: "none" }, 1.82 + k * Q);
        tl.to("#vx-persp", { x: 0, y: 0, duration: 0.08 }, 1.82 + 12 * Q);

        // ── 3,25 (batida): o vermelho engole tudo e "2:47" estala com o ronco ──
        tl.to("#vx-vermelho", { clipPath: "circle(130% at 50% 50%)", duration: 0.22, ease: "power3.in" }, 3.03);
        tl.set("#vx-relogio", { opacity: 1 }, 3.25);
        tl.fromTo("#vx-dig", { scale: 0.5, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.45, ease: "elastic.out(1, 0.45)" }, 3.25);
        ["#vx-d1", "#vx-d2", "#vx-d3", "#vx-d4"].forEach(function (id, i) {
          var t = 3.32 + i * 0.05;
          tl.to(id, { y: -70, scaleY: 1.12, scaleX: 0.92, duration: 0.12, ease: "power2.out" }, t);
          tl.to(id, { y: 0, duration: 0.1, ease: "power2.in" }, t + 0.12);
          tl.to(id, { scaleY: 0.8, scaleX: 1.14, duration: 0.05 }, t + 0.22);
          tl.to(id, { scaleY: 1, scaleX: 1, duration: 0.2, ease: "back.out(2)" }, t + 0.27);
        });
        var r2 = mulberry32(9);
        for (var k2 = 0; k2 < 12; k2++) {
          var amp = 26 * Math.pow(1 - k2 / 12, 1.5);
          tl.to("#vx-relogio", { x: (r2() * 2 - 1) * amp, y: (r2() * 2 - 1) * amp, duration: Q, ease: "none" }, 3.25 + k2 * Q);
        }
        tl.to("#vx-relogio", { x: 0, y: 0, duration: 0.06 }, 3.25 + 12 * Q);
        var origens = ["100% 100%", "100% 50%", "100% 0%", "0% 100%", "0% 50%", "0% 0%"];
        ["#vx-l1", "#vx-l2", "#vx-l3", "#vx-l4", "#vx-l5", "#vx-l6"].forEach(function (id, i) {
          tl.fromTo(id, { scale: 0, transformOrigin: origens[i] }, { scale: 1, duration: 0.14, ease: "back.out(2.5)", immediateRender: false }, 3.27 + (i % 3) * 0.03);
          tl.to(id, { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in" }, 3.5 + (i % 3) * 0.03);
        });
        // 3,83 (batida): os números despencam (abre pra "tudo fechado.")
        var r3 = mulberry32(99);
        ["#vx-d1", "#vx-d2", "#vx-d3", "#vx-d4"].forEach(function (id, i) {
          tl.to(id, { y: 980, rotation: (r3() * 2 - 1) * 34, duration: 0.32, ease: "power3.in" }, 3.8 + i * 0.03);
        });
        window.__timelines["vixe"] = tl;
      }
      document.fonts.load("900 200px Montserrat").then(construir);
    })();
  </script>
</template>
