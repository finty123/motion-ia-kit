  <script type="module">
    import "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
    import { THREE, makeStage, makePhone, makeCoin, ready, seg, ease, lerp } from "./compositions/kit3d.js";
    import { drawHome2 } from "./compositions/kit3d-extra.js";
    await ready();
    drawHome2(document.getElementById("ma-scr").getContext("2d"));
    const st = makeStage(document.getElementById("ma-3d"));
    st.ground.visible = true; st.ground.position.y = -2.45;
    st.key.position.set(2, 7, 6); st.key.target.position.set(3.5, -2, 0);
    const ph = makePhone();
    drawHome2(ph.ctx); ph.update();
    st.scene.add(ph.group);
    const coins = [];
    for (let i = 0; i < 7; i++) { const c = makeCoin({ R: 0.5, T: 0.12 }); st.scene.add(c); coins.push(c); }
    function render3d(t) {
      // celular 3D à esquerda, já virando pra frente enquanto a câmera chega
      const arrive = ease.outQuart(seg(t, 0.95, 1.7)), sp = ease.spring(seg(t, 1.05, 2.0)), idle = seg(t, 1.6, 2.3);
      ph.group.position.set(-0.95 - 0.9 * (1 - sp), -0.08 + idle * 0.04 * Math.sin(t * 1.7), 5.65);
      ph.group.rotation.set(lerp(0.25, 0.04, arrive), lerp(0.9, 0.34, arrive) + idle * 0.05 * Math.sin(t * 1.2), lerp(0.3, -0.04, sp));
      coins.forEach((c, i) => {
        const t0 = 3.68 + i * 0.1, kk = seg(t, t0, t0 + 0.45), fall = 1 - Math.pow(1 - kk, 2.2);
        c.visible = t >= t0;
        c.position.set(3.97 + Math.sin(i * 2.3) * 0.05 + (1 - fall) * (0.4 - (i % 3) * 0.4), lerp(3.6, -2.35 + i * 0.13, ease.outQuart(kk)), Math.sin(i) * 0.1);
        c.rotation.set(lerp(-Math.PI / 2 + 2.4 + i, -Math.PI / 2, ease.outQuart(kk)), 0, lerp(1.2 * (i % 2 ? 1 : -1), i * 0.4, kk));
      });
      st.render();
    }
    const tl = gsap.timeline({ paused: true });
    // corte seco pra mão: zoom out contínuo que começa acelerado, "mês inteiro" atrás com parallax
    tl.fromTo("#ma-shot", { scale: 1.85, transformOrigin: "960px 640px" }, { scale: 1, duration: 0.95, ease: "expo.out" }, 0);
    tl.to("#ma-shot", { scale: 0.95, duration: 0.5, ease: "none" }, 0.95);
    tl.fromTo("#ma-big", { scale: 1.35 }, { scale: 1, duration: 0.95, ease: "expo.out" }, 0);
    tl.to("#ma-big", { scale: 0.97, duration: 0.5, ease: "none" }, 0.95);
    tl.fromTo("#ma-big .w", { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.2 }, 0.04);
    tl.fromTo("#ma-back", { scale: 1.5, transformOrigin: "960px 600px" }, { scale: 0.96, duration: 1.45, ease: "expo.out" }, 0);
    tl.fromTo("#ma-front", { scale: 2.2, transformOrigin: "960px 600px" }, { scale: 0.94, duration: 1.45, ease: "expo.out" }, 0);
    tl.fromTo("#ma-hb1", { x: 0, y: 0 }, { x: 200, y: -80, duration: 1.45, ease: "none" }, 0);
    tl.fromTo("#ma-hb2", { x: 0, y: 0 }, { x: -220, y: 100, duration: 1.45, ease: "none" }, 0);
    gsap.utils.toArray("#ma-hand .ma-ic").forEach((el, i) => {
      tl.fromTo(el, { rotation: -12 + i * 5, y: 0 }, { rotation: 8 - i * 3, y: -26 + (i % 2) * 40, duration: 1.45, ease: "sine.inOut" }, 0);
    });
    // a câmera vai pra esquerda, onde está o celular 3D (desfoque de movimento no meio do caminho)
    tl.fromTo("#ma-hand", { x: 0 }, { x: 1920, duration: 0.5, ease: "power3.inOut" }, 0.95);
    tl.fromTo("#ma-scene", { x: -1920 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 0.95);
    // parallax + arrasto: o texto fica pra trás, a mão inclina com o movimento, os ícones da frente correm mais
    tl.to("#ma-big", { x: -380, skewX: 8, duration: 0.5, ease: "power3.inOut" }, 0.95);
    tl.to("#ma-shot", { rotation: 7, x: 160, duration: 0.5, ease: "power2.in" }, 0.95);
    tl.to("#ma-front", { x: 900, rotation: 10, duration: 0.5, ease: "power3.in" }, 0.95);
    tl.to("#ma-back", { x: -260, duration: 0.5, ease: "power2.inOut" }, 0.95);
    tl.fromTo("#ma-all", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, 0.95);
    const lines = [["#ma-l1", 1.36, 2.48], ["#ma-l2", 2.52, 3.58], ["#ma-l3", 3.62, 9]];
    for (const [sel, a, b] of lines) {
      tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(8px)", y: 22 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.32, ease: "expo.out", stagger: 0.08 }, a);
      if (b < 9) tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", y: -16, duration: 0.18, ease: "power2.in", stagger: 0.03 }, b);
    }
    // notificações de vidro saem da tela do celular e empilham à direita
    const cards = ["#ma-c1", "#ma-c2", "#ma-c3"], at = [1.42, 2.56, 3.66];
    cards.forEach((c, i) => {
      tl.fromTo(c, { x: -700, y: 40, scale: 0.3, rotation: -6, opacity: 0, filter: "blur(10px)" }, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "back.out(1.4)" }, at[i]);
      for (let j = i + 1; j < cards.length; j++) tl.to(c, { y: 152 * (j - i), scale: 1 - 0.05 * (j - i), opacity: 1 - 0.22 * (j - i), duration: 0.6, ease: "expo.out" }, at[j]);
    });

    const clock = { t: 0 };
