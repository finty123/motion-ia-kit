<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #dn-stage { position: absolute; inset: 0; overflow: hidden; }
    #dn-table { position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 40%, #fbf7f2 0%, #efe7de 60%, #e2d8cd 100%); }
    #dn-sun { position: absolute; inset: -20%; filter: blur(26px); transform: rotate(-24deg);
      background: repeating-linear-gradient(90deg, rgba(255,246,228,0) 0 90px, rgba(255,240,214,.75) 90px 200px, rgba(255,246,228,0) 200px 250px); mix-blend-mode: soft-light; }
    #dn-night { position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 45%, #2a1752 0%, #140d2b 55%, #0a0717 100%); }
    #dn-glow { position: absolute; left: 560px; top: 420px; width: 800px; height: 700px; border-radius: 50%; filter: blur(60px); background: radial-gradient(circle, rgba(176,107,255,.75), rgba(130,10,209,0) 70%); }
    #dn-3d { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #dn-txt { position: absolute; left: 0; right: 0; top: 150px; height: 130px; }
    .dn-p { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 600 112px/1 Outfit, sans-serif; letter-spacing: -3px; white-space: nowrap; }
    .dn-p .w { display: inline-block; margin-right: 24px; }
    #dn-picker { position: absolute; left: 1140px; top: 540px; perspective: 900px; }
    .dn-pi { position: absolute; left: 0; top: -44px; height: 88px; font: 600 76px/88px Outfit, sans-serif; letter-spacing: -2px; white-space: nowrap; transform-origin: 0 50% -260px; }
    #dn-pdot { position: absolute; left: -58px; top: -13px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e58bff, #820ad1 60%, #4a0a8c); box-shadow: 0 0 18px rgba(176,107,255,.8); }
    /* card com objetos 3D por palavra (rendendo / guardando / protegendo), no lugar exato do card do celular */
    #dn-obj { position: absolute; left: 60px; top: 270px; width: 960px; height: 540px; border-radius: 32px; overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, #efe6fb 55%, #dccbf5 100%); box-shadow: 0 40px 90px -30px rgba(42,8,80,.5), inset 0 2px 1px rgba(255,255,255,.9); }
    #dn-obj3d { position: absolute; inset: 0; width: 960px; height: 540px; }
  </style>
  <div id="root" data-composition-id="diaenoite" data-width="1920" data-height="1080">
    <div id="dn-stage">
      <div id="dn-table"></div><div id="dn-sun"></div><div id="dn-night"></div><div id="dn-glow"></div>
      <canvas id="dn-3d" width="1920" height="1080"></canvas>
      <div id="dn-txt">
        <div id="dn-p1" class="dn-p"><span class="w">De</span><span class="w">dia.</span></div>
        <div id="dn-p2" class="dn-p"><span class="w">De</span><span class="w">noite.</span></div>
        <div id="dn-p3" class="dn-p"><span class="w">No</span><span class="w">fim</span><span class="w">de</span><span class="w">semana.</span></div>
      </div>
    </div>
    <div id="dn-obj"><canvas id="dn-obj3d" width="960" height="540"></canvas></div>
    <div id="dn-picker">
      <div id="dn-pdot"></div>
      <div class="dn-pi">Pagando</div><div class="dn-pi">Investindo</div><div class="dn-pi">Rendendo</div><div class="dn-pi">Economizando</div>
      <div class="dn-pi">Guardando</div><div class="dn-pi">Organizando</div><div class="dn-pi">Protegendo</div><div class="dn-pi">Planejando</div>
    </div>
  </div>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
    import { THREE, makeStage, makePhone, drawAuto, drawLock, ready, seg, ease, lerp } from "./compositions/kit3d.js";
    import { makeBox, makeShield, makeCoinLite } from "./compositions/kit3d-extra.js";
    await ready();
    // ---- objetos do card: pilhas de moedas (rendendo), caixinha recebendo moedas (guardando), escudo (protegendo)
    const ob = makeStage(document.getElementById("dn-obj3d"), { w: 960, h: 540, fov: 30 });
    ob.ground.visible = true; ob.ground.position.y = 0; ob.ground.material.opacity = 0.2;
    ob.key.position.set(3, 7, 5); ob.key.target.position.set(0, 0, 0);
    const gStacks = new THREE.Group(), gBox = new THREE.Group(), gShield = new THREE.Group();
    ob.scene.add(gStacks, gBox, gShield);
    const H = [4, 6, 9, 12, 16], stacks = H.map((n, i) => {
      const arr = [];
      for (let k = 0; k < n; k++) { const c = makeCoinLite(0.36, 0.1); c.position.set(-1.9 + i * 0.95, 0.05 + k * 0.1, (i % 2) * 0.25); c.rotation.y = k * 0.7; gStacks.add(c); arr.push(c); }
      return arr;
    });
    const bx = makeBox({ W: 1.9, H: 1.15, D: 1.35 }); gBox.add(bx.group); bx.group.rotation.y = -0.4;
    const drops = []; for (let i = 0; i < 4; i++) { const c = makeCoinLite(0.3, 0.08); gBox.add(c); drops.push(c); }
    const shield = makeShield(); shield.position.y = 1.25; gShield.add(shield);
    function renderObj(t) {
      const a = -0.5 + 0.22 * (t - 2.5);
      ob.camera.position.set(Math.sin(a) * 7.2, 2.6, Math.cos(a) * 7.2); ob.camera.lookAt(0, 0.75, 0);
      const pop = (t0, t1) => ease.spring(seg(t, t0, t0 + 0.5)) * (1 - ease.inCubic(seg(t, t1 - 0.16, t1)));
      gStacks.scale.setScalar(Math.max(0.001, pop(2.5, 3.45))); gStacks.visible = t < 3.45;
      stacks.forEach((arr, i) => arr.forEach((c, k) => {
        const tk = 2.55 + i * 0.06 + k * 0.035, d = ease.outQuart(seg(t, tk, tk + 0.25));
        c.visible = t >= tk; c.position.y = 0.05 + k * 0.1 + (1 - d) * 1.4;
      }));
      gBox.scale.setScalar(Math.max(0.001, pop(3.45, 4.35))); gBox.visible = t >= 3.45 && t < 4.35;
      bx.hinge.rotation.x = -1.8 * ease.outExpo(seg(t, 3.55, 3.85)) * (1 - ease.inCubic(seg(t, 4.1, 4.25)));
      drops.forEach((c, i) => {
        const t0 = 3.7 + i * 0.09, k = seg(t, t0, t0 + 0.35);
        c.visible = t >= t0 && k < 1; c.position.set(0.15 * Math.sin(i * 2), lerp(3.2, 0.7, ease.inCubic(k)), 0.1); c.rotation.set(Math.PI / 2, 0, i);
      });
      gShield.scale.setScalar(Math.max(0.001, ease.spring(seg(t, 4.35, 4.85)))); gShield.visible = t >= 4.35;
      shield.rotation.y = -0.6 + 0.9 * ease.outQuart(seg(t, 4.35, 5.2));
      ob.render();
    }
    const st = makeStage(document.getElementById("dn-3d"), { fov: 32 });
    st.ground.visible = false;
    const ph = makePhone();
    ph.group.rotation.set(0, 0, 0);
    st.scene.add(ph.group);
    const glowL = new THREE.PointLight(0xb06bff, 0, 3, 1.5); glowL.position.set(0, 0, -0.7); st.scene.add(glowL);
    let lastKey = "";
    function render3d(t) {
      // dia (0) → noite (1) → fim de semana de manhã (0.15)
      const n = seg(t, 0.62, 0.9) - 0.85 * seg(t, 1.36, 1.66);
      st.key.intensity = lerp(1.7, 0.08, n); st.key.color.set(n > 0.5 ? 0x8a8cff : 0xfff0e2);
      st.key.position.set(lerp(3, -1, n), 6, lerp(-2, 1, n));
      st.fill.intensity = lerp(0.4, 0.05, n);
      st.scene.environmentIntensity = lerp(1, 0.18, n);
      glowL.intensity = 2.5 * n;
      // celular em pé, de frente, cortado embaixo; a câmera começa colada na tela (toggle da cena anterior) e recua
      const pb = ease.outExpo(seg(t, 0.0, 0.95));
      st.camera.position.set(0, lerp(0.3, 0.58, pb), lerp(0.62, 2.35, pb) + 0.12 * seg(t, 1.0, 2.6));
      st.camera.lookAt(0, lerp(0.3, 0.58, pb), -5);
      ph.group.rotation.set(0.04 * Math.sin(t * 0.8), 0.14 * Math.sin(t * 0.9) * seg(t, 0.4, 1.4), 0.02 * Math.sin(t * 1.1));
      let key, draw;
      if (t < 0.12) { key = "auto"; draw = () => drawAuto(ph.ctx, { on: 1 }); }
      else if (t < 0.74) { key = "dia"; draw = () => drawLock(ph.ctx, { hora: "09:41", data: "quinta-feira, 23 de outubro", k: 0 }); }
      else if (t < 1.45) { key = "noite" + Math.round(n * 10); draw = () => drawLock(ph.ctx, { hora: "23:14", data: "quinta-feira, 23 de outubro", k: n }); }
      else { key = "sab" + Math.round(n * 10); draw = () => drawLock(ph.ctx, { hora: "10:30", data: "sábado, 25 de outubro", k: n, notif: "Rendeu R$ 0,94 no fim de semana" }); }
      if (key !== lastKey) { draw(); ph.update(); lastKey = key; }
      document.getElementById("dn-night").style.opacity = n.toFixed(3);
      document.getElementById("dn-glow").style.opacity = n.toFixed(3);
      document.getElementById("dn-sun").style.opacity = (1 - n).toFixed(3);
      document.getElementById("dn-txt").style.color = n > 0.5 ? "#ffffff" : "#17121f";
      st.render();
    }
    // seletor (roda do iPhone): pos = índice no centro
    const pis = [...document.querySelectorAll(".dn-pi")], P = { pos: 1 };
    function wheel() {
      pis.forEach((el, i) => {
        const d = i - P.pos, ad = Math.abs(d);
        el.style.transform = `translateY(${(d * 90).toFixed(1)}px) rotateX(${(-d * 19).toFixed(2)}deg)`;
        el.style.opacity = Math.max(0, 1 - ad * 0.3).toFixed(3);
        el.style.color = ad < 0.5 ? "#17121f" : "#c4bdcf";
      });
    }
    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    const ph3 = [["#dn-p1", 0.06, 0.66], ["#dn-p2", 0.7, 1.36], ["#dn-p3", 1.4, 2.4]];
    for (const [sel, a, b] of ph3) {
      tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.07 }, a);
      tl.to(`${sel} .w`, { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, b);
    }
    // a cena encolhe e vira card; o seletor gira palavra por palavra
    tl.to("#dn-stage", { scale: 0.5, x: -420, borderRadius: 64, boxShadow: "0 40px 90px -30px rgba(42,8,80,.55)", duration: 0.55, ease: "power3.inOut" }, 2.18);
    tl.fromTo("#dn-obj", { opacity: 0, scale: 0.94, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.5)" }, 2.45);
    tl.fromTo("#dn-picker", { opacity: 0, x: 60, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 2.4);
    tl.fromTo(P, { pos: 1 }, { pos: 2, duration: 0.55, ease: "back.out(1.6)", onUpdate: wheel }, 2.52);
    tl.to(P, { pos: 4, duration: 0.6, ease: "back.out(1.6)", onUpdate: wheel }, 3.44);
    tl.to(P, { pos: 6, duration: 0.6, ease: "back.out(1.6)", onUpdate: wheel }, 4.34);
    tl.to("#dn-stage, #dn-obj, #dn-picker", { opacity: 0, filter: "blur(12px)", y: -40, duration: 0.25, ease: "power3.in" }, 5.12);
    // relógio por último: o seletor já está atualizado quando o quadro é desenhado
    tl.to(clock, { t: 5.45, duration: 5.45, ease: "none", onUpdate: () => { render3d(clock.t); renderObj(clock.t); wheel(); } }, 0);
    wheel(); render3d(0); renderObj(0);
    window.__timelines["diaenoite"] = tl;
  </script>
</template>
