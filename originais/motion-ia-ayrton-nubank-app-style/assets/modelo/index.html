<!DOCTYPE html>
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Nubank — comercial não oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6f4f9; }
      :root {
        --roxo: #820ad1; --roxo-esc: #4a0a8c; --lilas: #c9a3ff; --rosa: #e58bff; --ink: #17121f; --cinza: #c9c3d1; --bg: #f6f4f9;
        --grad: linear-gradient(100deg, #4a0a8c 0%, #820ad1 35%, #b06bff 60%, #e58bff 80%, #820ad1 100%);
      }
      #fundo { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #f6f4f9 55%, #ece7f3 100%); }
      #fundo::after { content: ""; position: absolute; inset: 0; opacity: 0.55;
        background-image: linear-gradient(rgba(130, 10, 209, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(130, 10, 209, 0.05) 1px, transparent 1px);
        background-size: 96px 96px; background-position: center; }

      /* Liquid Glass: vidro translúcido com desfoque e saturação do que está atrás, borda com reflexo de luz */
      .glass { position: absolute; border-radius: 999px; overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.22));
        backdrop-filter: blur(22px) saturate(190%) brightness(1.05); -webkit-backdrop-filter: blur(22px) saturate(190%) brightness(1.05);
        box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.95), inset 0 -2px 2px rgba(255, 255, 255, 0.35), inset 0 0 22px rgba(255, 255, 255, 0.35),
          0 24px 50px -14px rgba(74, 10, 140, 0.32), 0 3px 8px rgba(74, 10, 140, 0.08); }
      .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
        background: linear-gradient(150deg, #fff, rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, 0.85));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
      .glass.lilas { background: linear-gradient(135deg, rgba(222, 200, 255, 0.82), rgba(190, 150, 255, 0.5)); color: #2a0b4d; }
      .glass.roxo { background: linear-gradient(135deg, rgba(150, 60, 230, 0.85), rgba(110, 20, 200, 0.75)); color: #fff; }
      .gtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .ff { font-family: Outfit, Inter, sans-serif; }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fps="60" data-start="0" data-duration="35.5" data-width="1920" data-height="1080">
      <div id="fundo"></div>

      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html" data-start="0" data-duration="0.74" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="mao" data-composition-id="mao" data-composition-src="compositions/mao.html" data-start="0.74" data-duration="5.21" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="corrida" data-composition-id="corrida" data-composition-src="compositions/corrida.html" data-start="5.85" data-duration="6.65" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="lista" data-composition-id="lista" data-composition-src="compositions/lista.html" data-start="12.5" data-duration="5.15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="diaenoite" data-composition-id="diaenoite" data-composition-src="compositions/diaenoite.html" data-start="17.7" data-duration="5.45" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="rende" data-composition-id="rende" data-composition-src="compositions/rende.html" data-start="23.15" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:6"></div>
      <div id="vida" data-composition-id="vida" data-composition-src="compositions/vida.html" data-start="25.95" data-duration="4.65" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:7"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html" data-start="30.5" data-duration="5.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:8"></div>

      <!-- mix única (scripts/mix.py): narração + música "Motion" (Danijel Zambo) com sidechain + SFX de UI, -14 LUFS -->
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="35.5" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
